name: Build ASUNCION CHESS APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "main.js"
      - "style.css"
      - "package.json"
      - "vite.config.js"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
  push:
    branches:
      - main
      - royal-diamond-edition
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "main.js"
      - "style.css"
      - "package.json"
      - "vite.config.js"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Configure Gradle wrapper download timeout
        working-directory: android
        run: |
          # Use the smaller binary distribution and the direct Gradle download host.
          # The services.gradle.org URL redirects to GitHub Releases, which returned
          # HTTP 504 on the hosted runner. Keep a longer timeout for slower runners.
          sed -i 's#https\\://services.gradle.org/distributions/gradle-8.2.1-all.zip#https\\://downloads.gradle.org/distributions/gradle-8.2.1-bin.zip#' gradle/wrapper/gradle-wrapper.properties
          if grep -q '^networkTimeout=' gradle/wrapper/gradle-wrapper.properties; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          else
            printf '\nnetworkTimeout=120000\n' >> gradle/wrapper/gradle-wrapper.properties
          fi
          grep -E 'distributionUrl|networkTimeout' gradle/wrapper/gradle-wrapper.properties

      - name: Apply Pearl Royale Android launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26" "$RES/values"
          # Put the custom foreground in the SAME anydpi-v24 qualifier as the
          # Capacitor library vector. App resources take precedence over dependency
          # resources when Android merges identical resource names/configurations.
          # This avoids relying on deleting files inside Gradle dependency caches.
          mkdir -p "$RES/drawable-anydpi-v24"
          convert -background none public/asuncion-chess-icon.svg -resize 432x432 "$RES/drawable-anydpi-v24/ic_launcher_foreground.png"
          convert -background none public/asuncion-chess-icon.svg -resize 432x432 "$RES/drawable-nodpi/ic_launcher_foreground.png"
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "$RES/mipmap-$density"
            convert -background none public/asuncion-chess-icon.svg -resize "${size}x${size}" "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done
          cat > "$RES/values/ic_launcher_background.xml" <<'EOF'
          <resources><color name="ic_launcher_background">#08110C</color></resources>
          EOF
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Increase Gradle distribution download timeout
        working-directory: android
        run: |
          # Use the direct Gradle download host to avoid the GitHub release redirect
          sed -i 's#services.gradle.org/distributions/#downloads.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          if grep -q '^networkTimeout=' gradle/wrapper/gradle-wrapper.properties; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          else
            printf '\nnetworkTimeout=120000\n' >> gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify packaged launcher icon resources
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | grep -q 'res/drawable-anydpi-v24/ic_launcher_foreground.png'
          unzip -l "$APK" | grep -q 'res/mipmap-anydpi-v26/ic_launcher.xml'
          unzip -l "$APK" | grep -q 'res/mipmap-xxxhdpi-v4/ic_launcher.png'
          # Confirm the adaptive icon points at the app-owned foreground resource.
          unzip -p "$APK" resources.arsc > /tmp/resources.arsc
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump resources "$APK" > /tmp/apk-resources.txt
          grep -q 'drawable/ic_launcher_foreground' /tmp/apk-resources.txt
          echo "Custom Pearl Royale anydpi foreground PNG and adaptive launcher icon are packaged."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASUNCION-CHESS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
