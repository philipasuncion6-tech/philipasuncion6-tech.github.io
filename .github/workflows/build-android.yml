name: Build ASUNCION CHESS APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "main.js"
      - "style.css"
      - "package.json"
      - "vite.config.js"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
  push:
    branches:
      - main
      - royal-diamond-edition
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "main.js"
      - "style.css"
      - "package.json"
      - "vite.config.js"
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Apply Pearl Royale Android launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          RES="android/app/src/main/res"
          mkdir -p "$RES/drawable-nodpi" "$RES/mipmap-anydpi-v26" "$RES/values"
          convert -background none public/asuncion-chess-icon.svg -resize 432x432 "$RES/drawable-nodpi/ic_launcher_foreground.png"
          # Capacitor may contribute its default Android-robot foreground vector from
          # its library module, not only from app/src/main/res. Any-dpi vectors take
          # priority over our drawable-nodpi PNG, so remove every conflicting copy.
          find android node_modules -type f \\
            \( -name "ic_launcher_foreground.xml" -o -name "\$ic_launcher_foreground__0.xml" \) \\
            -path "*/drawable-anydpi-v24/*" -delete
          if find android node_modules -type f \\
            \( -name "ic_launcher_foreground.xml" -o -name "\$ic_launcher_foreground__0.xml" \) \\
            -path "*/drawable-anydpi-v24/*" | grep -q .; then
            echo "Default Android launcher foreground vector still exists"
            exit 1
          fi
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            mkdir -p "$RES/mipmap-$density"
            convert -background none public/asuncion-chess-icon.svg -resize "${size}x${size}" "$RES/mipmap-$density/ic_launcher.png"
            cp "$RES/mipmap-$density/ic_launcher.png" "$RES/mipmap-$density/ic_launcher_round.png"
          done
          cat > "$RES/values/ic_launcher_background.xml" <<'EOF'
          <resources><color name="ic_launcher_background">#08110C</color></resources>
          EOF
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify packaged launcher icon resources
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if unzip -l "$APK" | grep -E 'res/drawable-anydpi-v24/(\\$ic_launcher_foreground__0|ic_launcher_foreground)\\.xml'; then
            echo "APK still contains the default Android foreground vector"
            exit 1
          fi
          unzip -l "$APK" | grep -q 'res/drawable-nodpi-v4/ic_launcher_foreground.png'
          unzip -l "$APK" | grep -q 'res/mipmap-xxxhdpi-v4/ic_launcher.png'
          echo "Custom ASUNCION CHESS launcher PNGs are packaged; default robot vectors are absent."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASUNCION-CHESS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
